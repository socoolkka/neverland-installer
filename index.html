<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>neveripa — App Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Neverland home"><span class="brand-mark">N</span><span>NEVERIPA</span></a>
      <span class="status"><i></i> APP DISTRIBUTION</span>
    </header>

    <section class="intro">
      <p class="eyebrow">IOS APPLICATION DISTRIBUTION</p>
      <h1>Your apps.<br><span>One place.</span></h1>
      <p class="sub">Install an application directly from your iPhone.</p>
    </section>

    <section class="app-card" aria-label="KSign application">
      <div class="app-main">
        <div class="app-icon" aria-hidden="true">K</div>
        <div class="app-info">
          <h2>KSign</h2>
          <p>iOS Application <span>•</span> IPA</p>
        </div>
        <span class="version">IPA</span>
      </div>
      <a class="install" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fneveripa.onrender.com%2Fmanifest%2FKSign.plist"><span>INSTALL KSign</span><span class="arrow">↗</span></a>
      <p class="hint">Open this page in Safari on your iPhone to install.</p>
    </section>

    <footer>NEVERIPA <span>·</span> APP DISTRIBUTION</footer>
  </main>

</html>
