<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Neverland — App Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Neverland home"><span class="brand-mark">N</span><span>NEVERLAND</span></a>
      <span class="status"><i></i> APP LIBRARY</span>
    </header>

    <section class="intro">
      <p class="eyebrow">IOS APPLICATION DISTRIBUTION</p>
      <h1>Your apps.<br><span>One place.</span></h1>
      <p class="sub">A simple place to install the applications you use.</p>
    </section>

    <section class="app-card" aria-label="Application">
      <div class="app-main">
        <div class="app-icon" aria-hidden="true">N</div>
        <div class="app-info">
          <h2>Neverland</h2>
          <p>iOS Application <span>•</span> IPA</p>
        </div>
        <span class="version">iOS</span>
      </div>
      <a class="install" href="itms-services://?action=download-manifest&url=https%3A%2F%2Fraw.githubusercontent.com%2Fsocoolkka%2Fneverland-installer%2Fmain%2Fmanifest.plist">
        <span>INSTALL</span><span class="arrow">↗</span>
      </a>
      <p class="hint">Open this page in Safari on your iPhone to install.</p>
    </section>

    <footer>NEVERLAND <span>·</span> APP DISTRIBUTION</footer>
  </main>
</body>
</html>
